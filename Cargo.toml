[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/waste_token",
    "contracts/collector_registry",
    "contracts/collection_point",
    "contracts/waste_transaction",
    "contracts/payment_distribution",
    "contracts/reputation",
    "contracts/material_pricing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79.0"

[workspace.dependencies]
soroban-sdk = { version = "27.0.6", default-features = false, features = ["alloc"] }

# Package section for integration tests
[package]
name = "wastefi-contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.79.0"

[dependencies]

[dev-dependencies]
soroban-sdk = { version = "21.7.7", features = ["testutils"] }
common = { path = "contracts/common" }
waste_token = { path = "contracts/waste_token" }
collector_registry = { path = "contracts/collector_registry" }
collection_point = { path = "contracts/collection_point" }
waste_transaction = { path = "contracts/waste_transaction" }
payment_distribution = { path = "contracts/payment_distribution" }
reputation = { path = "contracts/reputation" }
material_pricing = { path = "contracts/material_pricing" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
