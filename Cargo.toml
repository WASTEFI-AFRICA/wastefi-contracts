[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/waste_token",
    "contracts/collector_registry",
    "contracts/collection_point",
    "contracts/waste_transaction",
    "contracts/payment_distribution",
    "contracts/reputation",
    "contracts/material_pricing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79.0"

[workspace.dependencies]
soroban-sdk = { version = "21.7.7", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
